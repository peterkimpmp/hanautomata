[package]
name = "hanautomata-tsf"
version = "0.5.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Hanautomata Windows input method (S0 build): the shared Rust engine behind a TSF text service, and its setup tool."
publish = false

[lib]
name = "hanautomata_tsf"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hanautomata-ime-setup"
path = "src/bin/setup.rs"

[[bin]]
name = "hanautomata-config-probe"
path = "src/bin/config_probe.rs"
required-features = ["quality-probes"]

[features]
quality-probes = ["windows/Win32_Security_Isolation", "windows/Win32_UI_Shell"]

[dependencies]
hanautomata-ffi = { path = "../ffi", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# The setup tool's manifest (asInvoker): without one, Windows treats a 32-bit exe named "...setup..." as an installer
# and demands elevation (ERROR_ELEVATION_REQUIRED, Windows 365, 2026-10-12). Pure Rust: no rc or windres needed.
embed-manifest = "1.5"

# windows 0.59 is the last release that links through prebuilt import libraries (windows-targets 0.53). From 0.60 the
# crates use raw-dylib, which Rust's GNU toolchain builds with MinGW dlltool + as: not in the toolchain, and the
# llvm-dlltool stand-in made test binaries crash (2026-10-12, Windows 365). windows-result and windows-strings are held at
# 0.3.0, the last patch releases on windows-targets, for the same reason.
[target.'cfg(windows)'.dependencies]
windows-core = "0.59"
windows-result = "=0.3.0"
windows-strings = "=0.3.0"
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
# The COM callback guards must unwind locally instead of aborting the host application.
panic = "unwind"
