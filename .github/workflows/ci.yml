name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  personal-assist:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Local recommendation, persistence and JSONL regressions
        run: cargo test --locked --manifest-path core/tools/assist/Cargo.toml
      - name: C# client against the real Rust service
        run: dotnet run --project tests/dotnet/Hanautomata.Assist -c Release -- core/tools/assist/target/debug/hanautomata-assist${{ runner.os == 'Windows' && '.exe' || '' }}
  macos-input-method:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rust, Swift, AppKit and safe installer regressions
        run: ./macos/build.sh --test
      - name: Universal input method and offline proofreading package
        run: ./macos/package.sh --with-proofreading
      - name: Extracted release payload, architectures and signatures
        run: python3 macos/Tests/verify_package.py macos/build/dist/Hanautomata-$(cat VERSION)-macos.zip --with-proofreading
      - uses: actions/upload-artifact@v4
        with:
          name: Hanautomata-macos
          path: |
            macos/build/dist/*.zip
            macos/build/dist/*.sha256
  proofreading:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - name: Locate Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $libclang = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$libclang\libclang.dll")) { throw 'Windows runner libclang is required' }
          "LIBCLANG_PATH=$libclang" >> $env:GITHUB_ENV
      - name: Contract, CLI and corrupted data tests
        run: cargo test --locked --manifest-path core/tools/proofread/Cargo.toml
      - name: Data preparation and notice regressions
        run: python3 -m unittest discover -s core/tools/proofread -p 'test_*.py'
      - name: Fetch pinned public dictionary and preserve its notices
        run: python3 core/tools/proofread/prepare_dictionary.py
      - name: Real Korean dictionary (NFC and NFD)
        env:
          HANAUTOMATA_KO_DATA: ${{ github.workspace }}/build/proofreading-data
        run: cargo test --release --locked --manifest-path core/tools/proofread/Cargo.toml --test native -- --ignored
      - name: Real process cancellation, deadline and recovery
        env:
          HANAUTOMATA_KO_DATA: ${{ github.workspace }}/build/proofreading-data
        run: cargo test --release --locked --manifest-path core/tools/proofread/Cargo.toml --test worker -- --ignored
      - name: Release CLI build
        run: cargo build --release --locked --manifest-path core/tools/proofread/Cargo.toml
  cross-platform-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: One version across platforms (VERSION)
        run: sh check-version.sh
      - name: Compile the whole app against .NET Framework 4.8 reference assemblies (C# 5)
        run: dotnet build tests/dotnet/Hanautomata.App.Net48 -c Release
      - name: Unit tests on .NET 9
        run: dotnet run --project tests/dotnet/Hanautomata.Tests -f net9.0 -c Release
      - name: Proofreading UTF-8/UTF-16 snapshot contract
        run: dotnet run --project tests/dotnet/Hanautomata.Proofreading -c Release
      - name: Compile standalone TSF review UI
        run: dotnet build tests/dotnet/Hanautomata.Proofreading.UI -c Release
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests with the Windows Framework compiler
        shell: pwsh
        run: .\build.ps1 -Test
      - name: Release build
        shell: pwsh
        run: .\build.ps1
      - name: IME settings persistence and editor build
        shell: pwsh
        run: .\tests\ImeSettingsTests.ps1 -BuildPreview
      - name: Personal expressions window layout at 96 DPI and native scale
        shell: pwsh
        run: .\tests\PersonalAssistLayoutTests.ps1
      - name: TSF payload and isolated user preparation
        shell: pwsh
        run: .\tests\TsfPayloadTests.ps1 -OptionsExecutable .\build\Hanautomata.ImeOptions.exe
      - name: Proofreading payload completeness and path boundaries
        shell: pwsh
        run: .\tests\TsfProofreadingPayloadTests.ps1
      - name: Proofreading WinExe pipes without an attached console
        shell: pwsh
        run: |
          & "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe" /nologo /target:winexe /main:Hanautomata.ProofreadingProgram /platform:anycpu /optimize+ /out:build/Hanautomata.Proofreading.exe /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Core.dll /reference:System.Web.Extensions.dll src\ProofreadingContract.cs src\ProofreadingWindow.cs
          if ($LASTEXITCODE -ne 0) { throw 'Proofreading helper compilation failed' }
          .\tests\TsfProofreadingHelperTests.ps1 -HelperExecutable .\build\Hanautomata.Proofreading.exe
      - name: Portable installation and packaging regression tests
        shell: pwsh
        run: .\tests\ReleaseTests.ps1
      - name: Startup registration and Windows-disabled regression tests
        shell: pwsh
        run: .\tests\StartupTests.ps1
      - name: SHA-256
        shell: pwsh
        run: Get-FileHash build\Hanautomata.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: Hanautomata-win
          path: |
            build/Hanautomata.exe
            build/Hanautomata.exe.config
            build/hanautomata-assist.exe
            build/Hanautomata.ImeOptions.exe
            build/Hanautomata.ImeOptions.exe.config
