[package]
name = "hanautomata-proofread"
version = "0.6.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false
description = "Experimental offline Korean spelling suggestions, separate from the IME"

[dependencies]
hunspell-rs = "=0.4.0"
# Enable bindgen's runtime libclang loading; hunspell-rs disables sys defaults.
hunspell-sys = { version = "=0.3.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
