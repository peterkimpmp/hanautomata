[package]
name = "hanautomata-ffi"
version = "0.6.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "UniFFI bindings of the Hanautomata engine for the platform input-method shells."
publish = false

[lib]
name = "hanautomata_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi"]

[features]
# The Swift bindings for macOS. The Windows input method (tsf/) uses the same Engine API from Rust without them.
default = ["uniffi"]
uniffi = ["dep:uniffi"]

[dependencies]
hanautomata-core = { path = "../core" }
uniffi = { version = "0.32.2", features = ["cli"], optional = true }

[profile.release]
lto = true
codegen-units = 1
